<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お見積り｜COMMERCE（エイトコマース）</title>
<meta name="description" content="COMMERCE（エイトコマース）のお見積りです。">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<style>
/* ===================================================================
   お客様向けの見積ページ（/q/:token）

   ここに出さないもの
     原価・粗利・社内メモ・在庫数・シリアル・管理番号。
     顧客ページが読むのは inv_quote_public() の返す内容だけで、
     この関数はそもそもそれらを返さない。

   見せかたの決まり
     ・明細は税抜で並べ、小計 → 消費税 → 税込総額 の順に出す
     ・初期費用と月額費用をはっきり分ける（月額が総額に埋もれないように）
     ・［この内容で進める］は契約ではない。その旨をボタンのそばに必ず書く
   =================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color:var(--c-ink);background:var(--c-bg);line-height:1.75;font-feature-settings:"palt" 1}
.sheet{max-width:880px;margin:0 auto;padding:0 20px 70px}
.bar{background:#fff;border-bottom:1px solid var(--c-line)}
.bar .in{max-width:880px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar img{height:30px;width:auto;display:block}
.bar .who{font-size:12.5px;color:var(--c-meta);margin-left:auto}
.card{background:#fff;border:1px solid var(--c-line);border-radius:4px;padding:28px 30px;margin-top:22px}
.qhead{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--c-ink);padding-bottom:16px}
.qhead h1{margin:0;font-size:clamp(23px,3vw,30px);letter-spacing:-.03em;line-height:1.3;flex:1 1 320px}
.qhead .no{font-size:12.5px;color:var(--c-meta);font-weight:700;letter-spacing:.06em}
.qmeta{display:flex;gap:12px 26px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--c-body)}
.qmeta b{color:var(--c-ink)}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--c-meta);font-weight:700;
  padding:0 10px 8px 0;border-bottom:1px solid var(--c-line)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--c-line);vertical-align:top}
td.r,th.r{text-align:right;padding-right:0}
.kind{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;background:#F1F1EE;color:var(--c-body)}
.kind.m{background:var(--c-ink);color:#fff}
.nm{font-weight:700}
.sp{font-size:12px;color:var(--c-meta);margin-top:2px;line-height:1.7}
.num{font-feature-settings:"tnum" 1}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.sum .box{border:1px solid var(--c-line);border-radius:3px;padding:16px 18px;background:var(--c-bg)}
.sum .box.on{border-color:var(--c-lime);background:var(--c-lime-l)}
.sum .k{font-size:12px;color:var(--c-meta);font-weight:700}
.sum .v{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.sum .v small{font-size:13px;font-weight:700;margin-left:3px}
.sum .note{font-size:11.5px;color:var(--c-meta);margin-top:4px;line-height:1.6}
.tot{margin-top:18px;border-top:2px solid var(--c-ink);padding-top:14px;display:grid;gap:8px;
  grid-template-columns:1fr auto;font-size:14.5px}
.tot .lbl{color:var(--c-body)}
.tot .val{text-align:right;font-weight:700}
.tot .grand{font-size:22px;font-weight:900}
.note-b{margin-top:20px;font-size:13px;line-height:1.9;color:var(--c-body);white-space:pre-wrap}
.actions{margin-top:26px;border-top:1px solid var(--c-line);padding-top:22px}
.actions h2{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
.actions p{margin:0 0 16px;font-size:13px;line-height:1.9;color:var(--c-body)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:3px;
  font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;border:1px solid var(--c-ink);background:var(--c-ink);color:#fff}
.btn.lime{background:var(--c-lime);border-color:var(--c-lime);color:var(--c-ink)}
.btn.ghost{background:#fff;color:var(--c-ink)}
.btn:disabled{opacity:.5;cursor:default}
.warn{border:1px solid #E7B4B4;background:#FDF6F6;color:#8A2F2F;border-radius:3px;padding:16px 18px;
  font-size:14px;line-height:1.85;margin-top:22px}
.info{border:1px solid var(--c-lime);background:var(--c-lime-l);border-radius:3px;padding:16px 18px;
  font-size:13.5px;line-height:1.85;margin-top:18px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field .req{color:#B3261E;font-size:10.5px;margin-left:5px}
.input{width:100%;min-height:46px;padding:10px 12px;font:inherit;font-size:15px;border:1px solid var(--c-line);border-radius:3px}
textarea.input{min-height:100px;line-height:1.8}
.done{text-align:center;padding:40px 20px}
.done .ic{width:52px;height:52px;border-radius:50%;background:var(--c-lime);display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:900;margin:0 auto 14px}
.foot{max-width:880px;margin:0 auto;padding:22px 20px 40px;font-size:12px;color:var(--c-meta);line-height:1.9}
@media print{
  body{background:#fff}
  .bar,.actions,.foot .noprint{display:none}
  .card{border:0;padding:0;margin:0}
}
@media(max-width:560px){
  .card{padding:20px 18px}
  .btn{width:100%}
  th.hide,td.hide{display:none}
}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a href="/" aria-label="COMMERCE トップへ"><img src="/assets/commerce-logo.png" alt="COMMERCE エイトコマース" width="260" height="56" decoding="async"></a>
  <span class="who" id="who"></span>
</div></div>

<div class="sheet" id="host">
  <div class="card"><p>お見積りを読み込んでいます…</p></div>
</div>

<div class="foot">
  <div>株式会社エイト（COMMERCE／8RENT）　〒150-0001 東京都渋谷区神宮前6-33-14 2F　03-6433-5025（平日9:00〜18:00）</div>
  <div class="noprint" style="margin-top:6px">このページのURLは、お客様と担当者のみにお知らせしています。</div>
</div>

<script src="/assets/quote-view.js"></script>
</body>
</html>
