<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>備品在庫管理｜株式会社エイト</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#18243E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* ========================================================================
   デザイントークン（design_handoff_qr_inventory/README.md の指定どおり）
   ライムは CTA・成果・重要数字だけに使う（画面の5〜10%を超えない）
   ======================================================================== */
:root{
  --bg:#FFFFFF; --text:#111111; --panel:#F7F7F3;
  --ink:#18243E;                      /* Deep Indigo：ボタン・リンク・現在地・強調 */
  --lime:#E7F056; --lime-press:#D8E148;
  --line:rgba(17,17,17,.14); --rule:rgba(17,17,17,.08);
  --i100:#EDF0F6; --i200:#DAE0EB; --i300:#AFB9CD; --i400:#7A89A6; --i500:#3D4E71;
  --i600:#142038; --i700:#111B2F; --i800:#0D1526; --i900:#0A1120;
  --l100:#FBFDE8; --l200:#F4FAC4; --l300:#ECF59B; --l400:#E7F056; --l500:#C9D23C;
  --n100:#F7F7F3; --n200:#EFEFE9; --n300:#DEDED7; --n400:#C2C2B9; --n500:#9A9A92;
  --n600:#6E6E68; --n700:#4A4A45; --n800:#2A2A27; --n900:#111111;
  --sh-sm:0 1px 2px rgba(17,17,17,.14); --sh-md:0 3px 10px rgba(17,17,17,.16); --sh-lg:0 12px 32px rgba(17,17,17,.22);
  --r1:1px; --r2:2px; --r4:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;font-weight:400}
a{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;user-select:none}

h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.sec{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:40px 0 15px}
.sec:first-child{margin-top:0}
.meta{font-size:12px;color:var(--n600)}
.sub{font-size:13px;color:var(--n700)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--n600);font-weight:500}

/* ---- レイアウト ---- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
#app{display:none}
#view{padding:20px 0 60px}

/* ---- ログイン ---- */
#gate{display:none;min-height:80vh;place-items:center;padding:30px 20px}
#gate .box{width:100%;max-width:380px;text-align:center}
#gate h1{font-size:28px;margin-bottom:10px}
#gate p{font-size:13px;color:var(--n600);margin-bottom:20px}
#gate .f{text-align:left;margin-bottom:12px}
#gate label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--n600);display:block;margin-bottom:5px}
#gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--r2);font-size:15px;background:#fff}
#gate .err{font-size:13px;color:#B3261E;min-height:20px;margin-bottom:6px}

/* ---- ヘッダー ---- */
.topline{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px 8px;background:var(--n100)}
.topline .brand{font-weight:500;font-size:15px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.topline .brand b{font-weight:700}
.topline .who{font-size:12px;color:var(--n600);display:inline-flex;align-items:center;gap:6px}
.topline .role{font-size:11px;letter-spacing:.08em;background:var(--i100);color:var(--i800);padding:2px 8px;border-radius:var(--r2)}
.topline button{border:1px solid var(--line);background:#fff;border-radius:var(--r2);padding:5px 10px;font-size:12px;cursor:pointer}

header.bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 12px}
.scanbtn{width:100%;min-height:62px;font-size:19px;font-weight:700;background:var(--lime);color:#111;border:none;
  border-radius:var(--r4);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.scanbtn:hover{background:var(--lime-press)}
.scanbtn .ms{font-size:30px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.menu button{position:relative;min-height:66px;padding:10px 6px 9px;border:1px solid var(--line);background:var(--n100);
  border-radius:var(--r2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12.5px;line-height:1.25;text-align:center}
.menu button .ms{font-size:24px}
.menu button:hover{background:var(--i100);border-color:var(--i300)}
.menu button.on{background:var(--i100);border:1px solid var(--ink);border-bottom-width:3px}

/* ---- 汎用 ---- */
.btn{min-height:44px;padding:10px 16px;border:1px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:var(--r2);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{background:var(--i100)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:var(--i600)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111;font-weight:700}
.btn.lime:hover{background:var(--lime-press);border-color:var(--lime-press)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:#fff}
.btn.pri:disabled:hover{background:var(--ink)}

.card{background:var(--panel);padding:15px;border-radius:var(--r2);box-shadow:var(--sh-sm)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);
  background:#fff;border-radius:var(--r2);font-size:15px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--n600);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:var(--r2);white-space:nowrap}
.tag .ms{font-size:15px}
.tag.big{font-size:13px;padding:5px 12px}
.tag.st-在庫{background:var(--i100);color:var(--i800)}
/* 今月まだ現物を見ていない在庫。注意を促す程度の薄い赤で、状態そのものは変えていない。
   色はこのリポジトリで使っている警告色（#FDECEC / #B3261E）にそろえる */
.tag.st-在庫.stale{background:#FDECEC;color:#B3261E;box-shadow:inset 0 0 0 1px rgba(179,38,30,.35)}
.tag.st-貸出中{background:var(--l100);color:var(--ink)}
.tag.st-使用中{background:var(--n200);color:#111}
.tag.st-修理中{background:var(--l200);color:#111}
.tag.st-故障{background:var(--ink);color:#fff}
.tag.st-紛失{background:var(--n300);color:#111}
.tag.st-廃棄{background:var(--n800);color:#fff}
.tag.act{background:var(--n200);color:var(--n800)}
/* 8RENT（レンタル対象）。状態とは別の軸なので、状態タグと見分けがつく色にする */
.tag.rent{background:var(--n100);color:var(--n600);border:1px solid var(--line)}
.tag.rent.on{background:var(--l300);color:#111;border-color:var(--l400);font-weight:500}
/* 棚卸の確認状況。実施中の「今回確認済」をいちばん強く出す */
.tag.chk{background:var(--n100);color:var(--n700);border:1px solid var(--line)}
.tag.chk.on{background:#E8F5E9;color:#1B5E20;border-color:#2E7D32;font-weight:700}
.tag.chk.todo{background:#FFF8E1;color:#8A6D00;border-color:#E8A33D;font-weight:700}
.tag.chk.none{background:var(--n100);color:var(--n600);border-style:dashed}
table.t td.ck-col{white-space:nowrap}
table.t td.ck-col .meta{font-size:11px;margin-top:2px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#fff}
.seg button{border:none;background:transparent;padding:9px 16px;font-size:13.5px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--ink);color:#fff}

.table-wrap{overflow-x:auto;margin-top:12px}
/* 案件・契約の進み具合を一列で出す（希望受付 › 見積 › … › 手配） */
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 18px;
  padding:10px 12px;background:var(--panel);border-radius:10px}
.fstep{font-size:12.5px;color:var(--n600);white-space:nowrap}
.fstep.done{color:var(--ink)}
.fstep.now{color:var(--ink);font-weight:700;background:var(--lime);
  padding:3px 9px;border-radius:999px}
.farrow{color:var(--n300);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--n600);font-weight:500;
  text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px 11px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--n100)}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.empty{padding:40px 20px;text-align:center;color:var(--n600);font-size:14px;background:var(--panel);border-radius:var(--r2)}
.rowline{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;flex-wrap:wrap}

/* ---- ダッシュボード ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:26px 20px;margin-bottom:10px}
.kpi .v{font-size:44px;font-weight:700;line-height:1;margin-top:4px}
.kpi .n{font-size:11px;color:var(--n600);margin-top:4px}
/* 経営数値。売上と粗利は大きく、赤字は色を変える */
.kpis.pl{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:22px 18px;padding:20px 22px;
  background:var(--n100);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:22px}
.kpis.pl .kpi .v{font-size:34px}
.kpis.pl .kpi.lead .v{font-size:46px}
.kpi .v.minus{color:#B3261E}
.kpi .v.na{font-size:22px;color:var(--n600);font-weight:500}
.plnote{font-size:11.5px;color:var(--n600);margin:-12px 0 22px;line-height:1.7}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.chk{cursor:pointer;border:none;text-align:left;font:inherit;display:block;width:100%}
.chk .h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.chk .h .ms{font-size:19px}
.chk .h .t{font-size:17px;font-weight:500;flex:1}
.chk .h .b{font-size:22px;font-weight:700;padding:0 9px;border-radius:var(--r2);line-height:1.3}
.chk .h .b.on{background:var(--lime);color:#111}
.chk .h .b.off{color:var(--n600)}
.chk .d{font-size:12px;color:var(--n700)}

/* ---- 詳細 ---- */
.detail{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.detail .main{flex:1 1 380px;min-width:0}
/* 個体詳細の右側：商品写真とQRを縦に並べる（現場で「この機器か」を確かめやすく） */
.detail .sidebox{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.photobox{width:240px;text-align:center}
.photobox img{max-width:100%;max-height:200px;width:auto;height:auto;object-fit:contain;
  background:#fff;padding:8px;border:1px solid var(--line);border-radius:var(--r2)}
.photobox .ph{display:grid;place-items:center;gap:4px;height:160px;background:var(--n100);
  border:1px solid var(--line);border-radius:var(--r2);color:var(--n600);font-size:12px}
.photobox .ph .ms{font-size:32px}
.photobox .u{font-size:10.5px;color:var(--n600);margin-top:6px}
.detail .qrbox{flex:0 0 auto;text-align:center}
.detail .qrbox img{width:140px;height:140px;image-rendering:pixelated;background:#fff;padding:6px;border:1px solid var(--line)}
.detail .qrbox .u{font-size:10px;color:var(--n600);word-break:break-all;max-width:152px;margin-top:6px}
.kind{font-size:12px;letter-spacing:.1em;color:var(--ink);font-weight:500}
.detail h1{font-size:36px;margin:4px 0 8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 20px;font-size:14px;margin:20px 0}
.info .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--n600);display:block}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}
.ops button{min-height:58px;flex-direction:column;gap:4px;padding:8px}
.ops button .ms{font-size:24px}
.ops button span.t{font-size:16px}
.bignum{font-size:52px;font-weight:700;line-height:1}
.needorder{display:inline-flex;align-items:center;gap:8px;background:var(--l100);color:var(--ink);
  padding:8px 14px;border-radius:var(--r2);font-size:14px}

/* ---- 棚卸 ---- */
.stcount{font-size:56px;font-weight:700;line-height:1}
.stcount small{font-size:26px;color:var(--n600);font-weight:400}
/* 在庫一覧の上に出す棚卸の進み具合。棚卸画面と同じ数字を出す */
.stbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;
  background:var(--l100);border:2px solid var(--l500);border-radius:var(--r2);padding:11px 14px}
.stbar > .ms{font-size:22px;flex:0 0 auto}
.stbar .t{font-weight:700;font-size:15px}
.stbar .prog{margin:0}
.prog{height:8px;background:var(--n300);border-radius:var(--r1);overflow:hidden;margin:12px 0 18px}
.prog i{display:block;height:100%;background:var(--lime)}
.unchecked{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.unchecked .u{background:var(--l100);padding:11px 12px;border-radius:var(--r2);display:flex;align-items:center;gap:10px}
.unchecked .u .ms{font-size:20px;color:var(--ink)}
.unchecked .u .n{font-size:14px;font-weight:500}
.unchecked .u .m{font-size:11px;color:var(--n600)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11.5px;background:var(--n200);padding:3px 8px;border-radius:var(--r2)}

/* ---- 保管場所 ---- */
.loctree .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.loctree .r .ms{font-size:20px;color:var(--n600)}
.loctree .r.shelf .ms{color:var(--ink)}
.loctree .r .n{font-weight:500}
.loctree .r .c{font-size:11px;color:var(--n600)}
.loctree .r .sp{margin-left:auto;display:flex;gap:6px}

/* ---- 貸出カード ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* ---- スキャナ ---- */
#scan{position:fixed;inset:0;z-index:90;background:#111;display:none;flex-direction:column}
#scan.on{display:flex}
#scan .h{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff;flex-wrap:wrap}
#scan .h .t{font-size:17px;font-weight:500;margin-right:auto}
#scan .h .cnt{background:var(--lime);color:#111;font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--r2)}
#scan .h button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:var(--r2);
  padding:7px 13px;font-size:13px;cursor:pointer;min-height:40px}
#scan .stage{flex:1 1 auto;position:relative;display:grid;place-items:center;overflow:hidden}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .aim{position:relative;width:min(70vw,260px);height:min(70vw,260px);border:2px solid var(--lime);
  box-shadow:0 0 0 100vmax rgba(17,17,17,.55);border-radius:var(--r2)}
#scan .noc{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--n900);
  color:#fff;text-align:center;gap:10px;align-content:center}
#scan .noc .ms{font-size:44px;opacity:.7}
#scan .foot{background:#fff;padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow:auto}
#scan .foot .row{display:flex;gap:8px}
#scan .foot .row .input{flex:1}
#scan .foot .sim{display:flex;flex-wrap:wrap;gap:6px}
#scan .foot .sim button{border:1px solid var(--line);background:var(--n100);border-radius:var(--r2);
  padding:7px 11px;font-size:12.5px;cursor:pointer;min-height:38px}

/* ---- ボトムシート ---- */
#sheet{position:fixed;inset:0;z-index:92;background:rgba(17,17,17,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .p{width:min(520px,100%);background:var(--panel);border-radius:var(--r4) var(--r4) 0 0;padding:20px 20px 24px;
  box-shadow:var(--sh-lg);animation:sheetUp .18s ease-out;max-height:88vh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#sheet .th{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
#sheet .th h2{font-size:24px;flex:1}
#sheet .th .id{font-size:12px;color:var(--n600)}
#sheet .hint{font-size:13px;color:var(--n700);margin-bottom:14px}
#sheet .acts{display:flex;gap:10px;margin-top:16px}
#sheet .acts .btn.cta{flex:1;min-height:52px;font-size:17px}
#sheet .acts .btn.cancel{width:120px}
#sheet input[type=number].input{font-size:20px;min-height:48px;text-align:center}

/* ---- 商品詳細のタブ ---- */
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 18px;overflow-x:auto}
.tabs2 button{border:none;background:transparent;padding:11px 16px;font-size:14px;font-weight:500;color:var(--n600);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs2 button .ms{font-size:19px}
.tabs2 button .n{font-size:11px;background:var(--n200);color:var(--n700);padding:1px 7px;border-radius:10px}
.tabs2 button:hover{color:var(--ink)}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tabs2 button.on .n{background:var(--ink);color:#fff}

/* ---- 在庫状態・販売チャネルのタグ ---- */
.tag.stk-ok{background:var(--i100);color:var(--i800)}
.tag.stk-few{background:var(--l200);color:#111}
.tag.stk-none{background:var(--n300);color:var(--n800)}
.tag.ch{background:var(--n200);color:var(--n700);font-weight:700;font-size:11px;padding:2px 7px}
.tag.ch.on{background:var(--ink);color:#fff}
/* 出品先。サイト名は長いので、一覧では小さなバッジだけを並べる */
.malls{display:inline-flex;gap:3px;flex-wrap:wrap}
table.t td.mall{white-space:nowrap}

/* ---- 在庫一覧の上のタブ（個体別・型番別・販売サイト別） ---- */
.chtabs{display:flex;gap:3px;align-items:center;border-bottom:1px solid var(--line);
  margin:12px 0 12px;overflow-x:auto;padding-bottom:1px}
.chtabs button{border:none;background:transparent;padding:10px 13px;font-size:13.5px;font-weight:500;
  color:var(--n600);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  display:inline-flex;align-items:center;gap:6px;min-height:42px}
.chtabs button .n{font-size:11px;background:var(--n200);color:var(--n700);padding:1px 7px;border-radius:10px}
.chtabs button:hover{color:var(--ink)}
.chtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;background:var(--l100)}
.chtabs button.on .n{background:var(--ink);color:#fff}
.chtabs .sep{flex:0 0 auto;width:1px;height:20px;background:var(--line);margin:0 6px}

/* ---- 在庫差異（手元に無いのに出品中のまま） ---- */
.diffbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 12px;
  background:#FFF4E5;border:1px solid #E8A33D;border-radius:var(--r2);padding:11px 14px}
.diffbar .ms{font-size:20px;color:#B26A00}
.diffbar .bt{font-weight:700}
.diffbar.on{background:var(--n100);border-color:var(--line)}
.diffbar.on .ms{color:var(--n600)}
table.t tr.warn td:first-child{box-shadow:inset 3px 0 0 #E8A33D}
/* 数量管理の行。管理番号を持たないので、個体の行と取り違えないよう地を変える */
table.t tr.qty td{background:var(--n100)}
.tag.stk-ok .ms,.tag.stk-few .ms{font-size:14px;margin-right:3px;vertical-align:-2px}
.warnbox{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 12px;
  background:#FFF4E5;border:1px solid #E8A33D;border-radius:var(--r2);padding:11px 14px;font-size:13.5px}
.warnbox .ms{font-size:20px;color:#B26A00}
.sec .secn{font-size:12.5px;font-weight:500;color:var(--n600);margin-left:12px;letter-spacing:0}

/* ---- 商品取込（入口は1つ。どのCSVかは中身で見分ける） ---- */
.impkinds{display:grid;gap:8px;margin-top:14px}
.impkinds > div{display:flex;gap:10px;align-items:flex-start;background:var(--n100);
  border-radius:var(--r2);padding:11px 13px;font-size:12.5px;color:var(--n700);line-height:1.7}
.impkinds .ms{font-size:20px;color:var(--n600);flex:0 0 auto}
.impkinds b{color:var(--ink);font-size:13.5px}

/* ---- 個体一覧 ---- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.unit{display:flex;gap:11px;align-items:flex-start;background:var(--panel);padding:11px;border-radius:var(--r2);box-shadow:var(--sh-sm)}
.unit img{image-rendering:pixelated;background:#fff;padding:3px;flex:0 0 auto;border:1px solid var(--line)}
.unit .ux{flex:1;min-width:0}
.unit .ua{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.unit .ua .btn{min-height:32px;padding:5px 10px;font-size:12px}

/* ---- 一覧のチェックボックスと一括操作 ---- */
table.t th.ck,table.t td.ck{width:34px;padding-right:0}
table.t td.ck input,table.t th.ck input{width:17px;height:17px;accent-color:var(--ink);cursor:pointer;vertical-align:middle}
table.t tr.clk.on td{background:var(--i100)}
table.t tr.clk.on:hover td{background:var(--i200)}

/* 選んだものをまとめて動かすバー。スクロールしても消えないよう画面下に固定する。
   PCは1行（左:件数／中央:操作／右:選択解除）、スマホは折り返して2段になる */
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -4px 18px rgba(17,17,17,.10);padding:11px 20px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
#selbar.on{display:flex}
#selbar .n{font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#selbar .n .ms{font-size:18px}
#selbar .sp{flex:1}
/* .ops（個体の操作メニュー）とは別物。こちらは横に並ぶ小さなボタン */
#selbar .selops{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:center}
#selbar .selops .btn{white-space:nowrap;min-height:38px;padding:7px 12px;font-size:13px;flex-direction:row}
#selbar .selops .btn .ms{font-size:17px}
/* バーが出ている間は、最後の行がバーに隠れないように下を空ける */
body.selbar-on{padding-bottom:104px}
/* スマホは「件数＋選択解除」で1段、操作ボタンで2段程度に折り返す */
@media(max-width:760px){
  .detail .sidebox{flex-direction:row;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .photobox{width:180px}
  #selbar{padding:9px 12px;gap:8px}
  #selbar .n{order:0;flex:1 1 auto}
  #selbar > .btn.ghost{order:1}
  #selbar .selops{order:2;flex:1 1 100%;justify-content:flex-start;gap:6px}
  #selbar .selops .btn{padding:6px 9px;font-size:12.5px;min-height:36px}
  body.selbar-on{padding-bottom:136px}
}

.bulkrow{border-bottom:1px solid var(--rule);padding:12px 0}
.bulkrow:last-child{border-bottom:none}
.bchk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
.bchk input{width:17px;height:17px;accent-color:var(--ink);cursor:pointer}
.bfield{margin:9px 0 0 25px}
.bfield.off{opacity:.35;pointer-events:none}

/* ---- 取り返しのつかない操作 ---- */
.dangerzone{display:flex;align-items:center;gap:12px;margin:40px 0 0;padding:13px 15px;
  border:1px solid #E7C4C4;background:#FDF5F5;border-radius:var(--r2)}
.dangerzone .ms{font-size:22px;color:#B3261E}
.btn.danger{border-color:#B3261E;color:#B3261E}
.btn.danger:hover{background:#FDECEC}
.btn.danger:disabled{opacity:.4}
.btn.danger:disabled:hover{background:#fff}

/* ---- 長い自由記述 ---- */
.pre{white-space:pre-wrap;word-break:break-word;background:var(--panel);padding:12px 14px;border-radius:var(--r2);font-size:13.5px;line-height:1.75}
.pre.legacy{background:var(--l100);font-size:12.5px;color:var(--n700)}

/* ---- モーダル（CSV取込の確認など、下からのシートに収まらないもの） ---- */
#modal{position:fixed;inset:0;z-index:93;background:rgba(17,17,17,.5);display:none;place-items:center;padding:20px}
#modal.on{display:grid}
/* min-width:0 が無いと、中の表の幅にひきずられて箱が画面からはみ出し、
   スマホでは右上の閉じるボタンに手が届かなくなる */
#modal .mbox{background:var(--bg);border-radius:var(--r4);width:min(760px,100%);min-width:0;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
#modal .mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
#modal .mh h2{flex:1;font-size:22px}
#modal .mh .x{border:none;background:transparent;cursor:pointer;color:var(--n600);padding:4px;display:flex}
#modal .mc{padding:16px 20px;overflow:auto;font-size:14px}
#modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:15px}
.sum > div{background:var(--panel);padding:11px 13px;border-radius:var(--r2)}
.sum .v{font-size:28px;font-weight:700;line-height:1.1}
.sum .v.add{color:var(--ink)}
.sum .v.skip{color:var(--n600)}
.sum .v.err{color:#B3261E}
/* 取り込めない理由の内訳と、その場の読み替え */
.reasons{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:14px}
.rgroup{padding:11px 13px;border-bottom:1px solid var(--rule)}
.rgroup:last-child{border-bottom:none}
.rh{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
.rh .rn{min-width:34px;text-align:center;background:#FDECEC;color:#B3261E;font-weight:700;
  border-radius:var(--r2);padding:1px 7px;font-variant-numeric:tabular-nums}
.rvals{margin:8px 0 0 43px;display:flex;flex-direction:column;gap:7px}
.rv{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rv .vv{font-weight:500;font-size:13.5px}
.rv .fixsel{width:auto;min-width:190px;min-height:36px;padding:6px 9px;font-size:13px;flex:0 1 auto}
@media(max-width:560px){.rvals{margin-left:0}.rv .fixsel{width:100%}}

.mapped{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:6px}
.mapped .mv{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--rule);font-size:13.5px;flex-wrap:wrap}
.mapped .mv:last-child{border-bottom:none}
.mapped .mv .vv{font-weight:500}
.mapped .mv .ar{color:var(--n500)}
.mapped .mv .btn{margin-left:auto}

.plist{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px}
.plist .p{display:flex;gap:10px;align-items:baseline;padding:7px 11px;border-bottom:1px solid var(--rule);font-size:12.5px}
.plist .p:last-child{border-bottom:none}
.plist .p .c{font-weight:700;flex:0 0 auto;min-width:88px}
.plist .p .why{color:#B3261E;margin-left:auto;text-align:right}
.sum .v .u{font-size:14px;font-weight:500;margin-left:3px;color:var(--n600)}
.sum .v.minus{color:#B3261E}
/* 件数は5つ並ぶので、1行に収まるところまで詰める */
.sum.five{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.sum.five .v{font-size:24px}
.sum.five .lbl{font-size:10.5px;letter-spacing:.06em}

/* ---- 値段（仕入 → 原価 → 売値 → 利益）---- */
.minus{color:#B3261E}
.plus{color:var(--ink)}
table.t .r{text-align:right}
table.t td.nos{font-size:11.5px;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t td.ops2{display:flex;gap:6px;align-items:center;padding-top:9px}
table.t td.ops2 .btn{min-height:32px;padding:5px 11px;font-size:12.5px}

/* ---- マスター管理（保管場所・カテゴリー） ----
   親子がひと目で分かるよう、左の余白で段を付ける。行の右に操作をまとめる。 */
.mtree{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-top:6px}
.mtree .r{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 12px;
  border-bottom:1px solid var(--rule);background:#fff}
.mtree .r:last-child{border-bottom:0}
.mtree .r:hover{background:var(--n100)}
.mtree .r.off{background:var(--n100)}
.mtree .r.off .n,.mtree .r.off .ms{color:var(--n500)}
.mtree .r > .ms{font-size:21px;color:var(--n600);flex:none}
.mtree .n{font-size:15px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mtree .c{font-size:11.5px;color:var(--n600);margin-top:3px}
.mtree .ops{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.mtree .ops .btn{min-height:30px;padding:4px 9px;font-size:12px}
.mtree .ops .btn .ms{font-size:16px}
.tag.off{background:var(--n200);color:var(--n600);font-size:10.5px}
.tag.pub{background:var(--l200);color:#43530E;font-size:10.5px}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.6;margin-top:8px;cursor:pointer}
.chk input{margin-top:2px;width:16px;height:16px;accent-color:var(--ink);flex:none}
@media(max-width:700px){
  .mtree .r{flex-wrap:wrap}
  .mtree .ops{flex:1 1 100%;justify-content:flex-start;margin-top:8px}
}

/* ---- 価格調査（楽天・Amazon・メルカリの検索結果を開くだけ） ----
   出品先の欄は「実際にどこへ出しているか」、こちらは外部検索のボタン。
   役割が違うので、見た目もはっきり分ける（角の丸い枠付きの小さなボタン）。 */
table.t th.mchk-col,table.t td.mchk-col{white-space:nowrap;width:1%}
.mchks{display:flex;gap:4px;align-items:center}
.mchks.sp{display:none}
.mchk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--n700);
  font-size:11.5px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer}
.mchk:hover{border-color:var(--ink);color:var(--ink);background:var(--n100)}
.mchk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mchk.off{color:var(--n500);background:var(--n100);border-style:dashed;cursor:not-allowed}
/* 相場を見に行く3つのあとに、自分の原価から値付けする［¥］を置く */
.mchk.calc{font-size:14px;border-color:var(--l500);background:var(--l100);color:var(--ink)}
.mchk.calc:hover{border-color:var(--ink);background:var(--l200)}
a.idlink{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
a.idlink:hover{border-bottom-color:currentColor}
a.idlink:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}

/* 狭い画面では在庫一覧（個体別）ごとカードに切り替えるので、
   価格調査の列だけをたたむ必要はなくなった（下の table.t.unittbl のところ）。
   .mchks.sp は在庫一覧の型番セルにあった二重表示をやめたので、いまは使っていない */
.mchks.sp{display:none}

/* ---- 在庫一覧（個体別）の表 ----------------------------------------------
   13列あって横に間延びし、右の 状態・棚卸・8RENT が切れていた。
   関係の近いものを同じセルの2段にまとめて10列にし、幅は colgroup の％で配る。
   `table-layout: fixed` なので**表の幅は必ず親と同じ**になり、横スクロールが出ない
   （スクロールバーを隠しているのではない）。この指定は在庫一覧の表だけに当てる。 */
table.t.unittbl{table-layout:fixed;width:100%}
table.t.unittbl th,table.t.unittbl td{padding:9px 6px 9px 0;vertical-align:top;word-break:break-word}
table.t.unittbl th{vertical-align:bottom}
table.t.unittbl th.ck,table.t.unittbl td.ck{padding-right:0}
table.t.unittbl td.ck{padding-top:10px}      /* 1行目の高さに合わせる */
table.t.unittbl td.col-id{font-weight:600;line-height:1.35}
table.t.unittbl td.col-id .meta{font-weight:400}
table.t.unittbl .mdl{font-weight:500;line-height:1.35}
table.t.unittbl td.col-price{line-height:1.35;padding-right:12px}  /* 数字が右の欄にくっつかないように */
table.t.unittbl td.col-market{padding-right:4px}
table.t.unittbl td.col-market .mchks{flex-wrap:wrap;gap:3px}
table.t.unittbl td.col-listing{white-space:normal}
table.t.unittbl td.col-listing .malls{gap:3px}
table.t.unittbl td.col-loc{line-height:1.45}
/* タグは切らない。左右の余白だけ少し詰めて1行に収め、
   それでも入らないときは折り返す（切るよりは折り返す） */
/* タグは中身のぶんだけ。入りきらないときだけ折り返す（切るよりは折り返す）。
   棚卸の印は class="tag chk" で、チェックボックスの .chk（display:flex）と名前が当たる。
   あちらが後ろにあるので欄いっぱいに広がってしまうため、ここで戻している */
table.t.unittbl td.col-status .tag,table.t.unittbl td.col-check .tag,
table.t.unittbl td.col-rental .tag{display:inline-flex;width:max-content;max-width:100%;
  white-space:normal;text-align:left;padding:3px 7px}
table.t.unittbl td .meta{font-size:11px;margin-top:2px;line-height:1.45}
table.t.unittbl td.col-check .meta{white-space:normal}

/* 狭い画面では10列を押し込まず、1件1カードにする。情報は1つも隠さない */
@media(max-width:700px){
  table.t.unittbl,table.t.unittbl tbody,table.t.unittbl tr,table.t.unittbl td{display:block;width:auto}
  table.t.unittbl{table-layout:auto}
  table.t.unittbl colgroup{display:none}
  /* 見出しの行は要らないが、「表示中をすべて選ぶ」だけはカードでも使えるように残す */
  table.t.unittbl thead,table.t.unittbl thead tr{display:block;border:none;padding:0;margin:0;background:none}
  table.t.unittbl thead th{display:none}
  table.t.unittbl thead th.ck{display:flex;align-items:center;gap:9px;padding:0 0 10px;width:auto}
  table.t.unittbl thead th.ck::after{content:"表示中をすべて選ぶ";font-size:12px;
    color:var(--n600);letter-spacing:0;text-transform:none;font-weight:400}
  table.t.unittbl tr{border:1px solid var(--line);border-radius:var(--r2);
    padding:10px 12px;margin-bottom:10px;background:#fff}
  table.t.unittbl tr.qty{background:var(--n100)}
  table.t.unittbl tr.clk.on{background:var(--i100)}
  /* 左に項目名、右に中身。中身が2つ3つあるときは右側だけで縦に積む */
  table.t.unittbl td{border:none;padding:4px 0;display:grid;
    grid-template-columns:72px minmax(0,1fr);gap:0 10px;align-items:start}
  table.t.unittbl td::before{content:attr(data-label);grid-column:1;grid-row:1;
    font-size:11px;color:var(--n600);padding-top:2px}
  table.t.unittbl td > *{grid-column:2;min-width:0;justify-self:start}
  table.t.unittbl td.ck{display:block;padding:0 0 6px;width:auto}
  table.t.unittbl td.ck::before{content:none}
  /* 価格だけは「¥35,600　予定 ¥46,300」と横に並べたほうが読みやすい */
  table.t.unittbl td.col-price{display:flex;flex-wrap:wrap;align-items:baseline;
    gap:0 10px;text-align:left}
  table.t.unittbl td.col-price::before{flex:0 0 72px}
  table.t.unittbl td.col-price > div{margin:0}
  table.t.unittbl td.col-market .mchks{flex-wrap:wrap}
}
table.t.buy input.plan{width:116px;min-height:38px;text-align:right;padding:6px 9px;font-size:14px;display:inline-block}
/* 数量は必ず直せる欄。直したことが分かるよう、CSVの値との差を下に出す */
table.t.buy input.qty{width:74px;min-height:38px;text-align:center;padding:6px 8px;font-size:15px;font-weight:600;display:inline-block}
table.t.buy .qn{font-size:11px;margin-top:3px;text-align:center}
table.t.buy .qn.chg{color:#8A6D00;font-weight:700}
table.t.buy tfoot th{border-top:2px solid var(--ink);border-bottom:none;font-size:14px;
  text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700;padding-top:11px}
table.t.buy td .meta{font-size:11.5px;margin-top:2px}
/* 取込確認画面の行ごとの分類。判定根拠を値のすぐ下に出す */
table.t.buy td.pick{min-width:158px}
table.t.buy td.pick select.input{width:100%;min-width:150px;min-height:38px;padding:6px 8px;font-size:13px}
table.t.buy td.pick .why{display:inline-block;margin-top:4px;font-size:11px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--rule);color:var(--n700);background:var(--n100);white-space:nowrap}
table.t.buy td.pick .why.w1{border-color:#2E7D32;color:#1B5E20;background:#E8F5E9}
table.t.buy td.pick .why.w3{border-color:var(--ink);color:var(--ink);background:#fff}
table.t.buy td.pick .why.ng{border-color:#B3261E;color:#B3261E;background:#FDECEA;font-weight:700}
.impTodo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;
  padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--n100)}
.impTodo .tg{font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap}
.impTodo .tg.ok{background:#E8F5E9;color:#1B5E20}
.impTodo .tg.warn{background:#FFF8E1;color:#8A6D00}
.impTodo .tg.ng{background:#FDECEA;color:#B3261E}

.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;align-items:end;
  background:var(--panel);border-radius:var(--r2);padding:12px 14px;margin:14px 0}
.prices .v{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.prices .btn{align-self:center;justify-self:end}
.uprice{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:3px;font-variant-numeric:tabular-nums}
.uprice .ar{color:var(--n500)}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:9px 0;border-top:1px solid var(--rule);font-size:13.5px;color:var(--n600)}
.prow b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- 仕入CSV取込の入口・履歴・絞り込み ---- */
.drop{border:2px dashed var(--n300);border-radius:var(--r2);background:var(--panel);
  padding:30px 20px;text-align:center;transition:background .12s,border-color .12s}
.drop.on{border-color:var(--lime);background:var(--l100)}
.drop .ms{font-size:40px;color:var(--n500);display:block;margin-bottom:6px}
.drop .t{font-size:15px;font-weight:500;margin-bottom:14px}
.drop .btn{min-height:46px;padding:10px 22px}
.listtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 商品登録は「CSVでまとめて」が主、「1件ずつ」が従。見た目もその順に振る */
.regmain{margin-top:18px;background:var(--l100);border:2px solid var(--l500);border-radius:var(--r4);padding:20px 22px}
.regmain .rmh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.regmain .rmh > .ms{font-size:38px;color:var(--ink)}
.regmain h2{font-size:23px;letter-spacing:-.02em;line-height:1.3}
.regmain p{font-size:14px;color:var(--n700);margin-top:5px;line-height:1.7}
.regmain .rmbtn{min-height:56px;padding:12px 26px;font-size:17px;flex:0 0 auto}
.regmain .rmbtn .ms{font-size:22px}
.regmain .rmdone{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:16px;
  background:#fff;border:1px solid var(--l500);border-radius:var(--r2);padding:12px 14px}
.regmain .rmdone .ms{font-size:22px;color:#2E7D32}
.regmain .rmdone .t{font-weight:700;font-size:16px}
.regmain .rmlast{margin-top:14px;font-size:12.5px;color:var(--n600)}
.sec.regsub{font-size:18px;margin:38px 0 10px;color:var(--n700)}
@media(max-width:560px){.regmain .rmbtn{width:100%}}
.histline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 10px}
.histline .ms{font-size:17px;color:var(--n500)}
.batchbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 12px;
  background:var(--l100);border:1px solid var(--l500);border-radius:var(--r2);padding:11px 14px}
.batchbar .ms{font-size:20px}
.batchbar .bt{font-weight:500}
/* 取り込んだ直後は件数がいちばんに目に入るようにする */
.batchbar.done{border-width:2px;padding:13px 15px}
.batchbar.done .ms{color:#2E7D32;font-size:24px}
.batchbar.done .bt{font-weight:700;font-size:18px}
/* 「登録できた」で終わらせない。QRを貼るまでが1回の仕入作業だと分かるようにする */
.nextstep{display:flex;align-items:flex-start;gap:11px;margin:0 0 14px;
  background:#FFF8E1;border:2px solid #E8A33D;border-radius:var(--r2);padding:12px 15px}
.nextstep .ms{font-size:24px;color:#8A6D00;flex:0 0 auto}
.nextstep .t{font-weight:700;font-size:16px}
.nextstep .meta{margin-top:3px}
.regmain .rmnext{display:flex;align-items:flex-start;gap:9px;margin-top:10px;font-size:13px;
  color:#5C4700;background:#FFF8E1;border:1px solid #E8A33D;border-radius:var(--r2);padding:10px 13px;line-height:1.7}
.regmain .rmnext .ms{font-size:19px;color:#8A6D00;flex:0 0 auto}

/* ---- トースト ---- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;background:var(--n900);color:#fff;
  padding:12px 20px;border-radius:var(--r4);box-shadow:var(--sh-lg);font-size:14px;display:none;align-items:center;gap:10px;
  animation:toastIn .16s ease-out;max-width:92vw}
#toast.on{display:flex}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---- セットアップ案内 ---- */
#setup{display:none;background:var(--l100);border:1px solid var(--l500);border-radius:var(--r2);padding:16px 18px;margin:20px 0}
#setup h2{font-size:18px;margin-bottom:6px}
#setup p{font-size:13.5px;line-height:1.9}
#setup code{background:#fff;border:1px solid var(--line);border-radius:var(--r1);padding:1px 6px;font-size:12.5px}

/* ---- QRラベル（実寸 40×30mm） ---- */
.labels{display:flex;flex-wrap:wrap;gap:2mm}
.label{width:40mm;height:30mm;background:#fff;border:1px solid var(--n300);display:flex;align-items:center;gap:1.5mm;
  padding:1.5mm;break-inside:avoid}
.label img{width:22mm;height:22mm;image-rendering:pixelated;flex:0 0 auto}
.label .tx{min-width:0;overflow:hidden}
.label .tx .id{font-size:7pt;font-weight:700;line-height:1.2}
.label .tx .nm{font-size:6pt;line-height:1.25;margin-top:.6mm}
.label .tx .lo{font-size:5.5pt;color:#555;line-height:1.2;margin-top:.6mm}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:12px 0 20px}
.picks label{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--n100);border-radius:var(--r2);
  cursor:pointer;font-size:13px}

@media print{
  [data-noprint]{display:none !important}
  body{background:#fff}
  #view{padding:0}
  .wrap{max-width:none;padding:0}
  @page{margin:8mm}
}
@media(max-width:560px){
  h1{font-size:30px}
  .detail h1{font-size:28px}
  .kpi .v{font-size:36px}
  .bignum{font-size:42px}
  .stcount{font-size:42px}
}
</style>
</head>
<body>

<div id="gate"><div class="box">
  <h1>備品在庫管理</h1>
  <p>会社のアカウントでログインしてください。</p>
  <div class="err" id="gateErr"></div>
  <div class="f"><label>ID</label><input id="g-id" autocomplete="username" placeholder="zimu"></div>
  <div class="f"><label>パスワード</label><input id="g-pw" type="password" autocomplete="current-password"></div>
  <button class="btn lime" style="width:100%;min-height:52px;font-size:16px" onclick="doLogin()">ログイン</button>
</div></div>

<div id="app">
  <div class="topline" data-noprint>
    <div class="brand"><b>備品在庫管理</b><span class="meta" id="siteName"></span></div>
    <span class="who"><span id="whoName"></span><span class="role" id="whoRole"></span></span>
    <button onclick="signOut()">ログアウト</button>
  </div>

  <header class="bar" data-noprint><div class="wrap">
    <button class="scanbtn" onclick="openScan('lookup')"><span class="ms">qr_code_scanner</span>QRコードを読み取る</button>
    <nav class="menu" id="menu"></nav>
  </div></header>

  <div class="wrap">
    <div id="setup">
      <h2>先にセットアップSQLの実行が必要です</h2>
      <p>この画面が使う表がまだ作られていません。Supabase の SQL Editor に
        <code>zaiko/setup.sql</code> の中身をすべて貼り付けて実行してください。何度実行しても安全です。<br>
        <span class="meta" id="setupErr"></span></p>
    </div>
    <main id="view"></main>
  </div>
</div>

<div id="scan" data-noprint>
  <div class="h">
    <span class="t" id="scanTitle">QRコードを読み取る</span>
    <span class="cnt" id="scanCount" style="display:none"></span>
    <button onclick="closeScan()">閉じる</button>
  </div>
  <div class="stage">
    <video id="cam" autoplay muted playsinline></video>
    <div class="aim"></div>
    <div class="noc" id="scanNoCam" style="display:none">
      <span class="ms">no_photography</span>
      <div id="scanNoCamMsg" style="font-size:14px;max-width:32em"></div>
    </div>
  </div>
  <div class="foot">
    <div class="row">
      <input class="input" id="manualId" placeholder="管理番号を入力（例 PC-00125）" autocomplete="off"
             onkeydown="if(event.key==='Enter')openManual()">
      <button class="btn pri" onclick="openManual()">開く</button>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">読み取りをシミュレート</div>
      <div class="sim" id="scanSim"></div>
    </div>
  </div>
</div>

<!-- CSVの取込はどの画面からでも呼べるので、ファイル選択は画面の外に置く -->
<input type="file" id="csvFile" accept=".csv,.txt,text/csv" style="display:none" onchange="readInventoryCsv(this)">

<div id="sheet" data-noprint onclick="if(event.target===this)closeSheet()">
  <div class="p" id="sheetPanel"></div>
</div>

<div id="modal" data-noprint onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <div class="mh"><h2 id="modalTitle"></h2>
      <button class="x" onclick="closeModal()"><span class="ms">close</span></button></div>
    <div class="mc" id="modalBody"></div>
    <div class="mf" id="modalFoot"></div>
  </div>
</div>

<!-- 中身は app.js の refreshSelBar() が入れる（個体別と型番別で操作が変わるため） -->
<div id="selbar" data-noprint></div>

<div id="toast" data-noprint><span class="ms">check_circle</span><span id="toastMsg"></span></div>

<!-- /zaiko（末尾スラッシュなし）でも読めるよう、パスは絶対で書く -->
<script src="/assets/csv.js"></script>
<script src="/zaiko/app.js"></script>
</body>
</html>
